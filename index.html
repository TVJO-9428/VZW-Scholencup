<!DOCTYPE html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aanmelden – Schoolcup-portaal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/stijl.css"><link rel="icon" href="assets/logo.webp">
</head>
<body>
<header class="schild"><div class="wrap"><div class="kop2">
  <img src="assets/logo.webp" alt="Logo Verbroedering Schoolcup Zwijndrecht">
  <div><h1>Schoolcup-portaal</h1><p>Voor deelnemende scholen</p></div>
</div></div></header>
<main class="wrap"><div class="vlak smal">
  <h2>Aanmelden</h2>
  <form id="form" novalidate>
    <label class="veld">E-mailadres<input type="email" id="email" autocomplete="username" required></label>
    <label class="veld">Wachtwoord<input type="password" id="pw" autocomplete="current-password" required></label>
    <button class="knop breed" type="submit">Aanmelden</button>
  </form>
  <div id="msg"></div>
  <div class="links"><a href="wachtwoord.html">Wachtwoord vergeten?</a><a href="aanvraag.html">Deelname aanvragen</a><a href="reglement.html">Reglement &amp; afspraken</a></div>
</div></main>
<script type="module">
import { sb, melding } from "./js/supabase.js";
const msg = document.getElementById("msg");
const { data: { session } } = await sb.auth.getSession();
if (session) location.replace("portaal.html");
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  melding(msg, "Bezig met aanmelden…", "blauw");
  const { error } = await sb.auth.signInWithPassword({ email: document.getElementById("email").value.trim(), password: document.getElementById("pw").value });
  if (error) return melding(msg, "Aanmelden mislukt: controleer je e-mailadres en wachtwoord.", "rood");
  location.replace("portaal.html");
});
</script>
</body>
</html>
