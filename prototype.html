<!DOCTYPE html>
<html lang="nl-BE"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schoolcup-portaal – prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1633; --navy-2:#13254F; --groen:#1FA64A; --blauw:#1F64D6; --zilver:#C8D1DD;
  --tekst:#0E1A2E; --zacht:#55617A; --lijn:#D9E0EA; --vlak:#FFFFFF; --bg:#F2F5F9;
  --let:#D89A00; --kaart:#C62E2E;
  --kop:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --tekst:#E7ECF4; --zacht:#9AA8BF; --lijn:#26324A; --vlak:#111B30; --bg:#0A1222; --navy:#060E22; --navy-2:#0F1D3D;
}}
:root[data-theme="dark"]{--tekst:#E7ECF4; --zacht:#9AA8BF; --lijn:#26324A; --vlak:#111B30; --bg:#0A1222; --navy:#060E22; --navy-2:#0F1D3D;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tekst);font-family:var(--body);font-size:16px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--kop);font-weight:700;line-height:1.1;margin:0 0 .5em;letter-spacing:.01em}
h2{font-size:2.1rem;font-style:italic;font-weight:800}
h3{font-size:1.4rem;margin-top:1.3em}
p,li{max-width:74ch}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--groen);outline-offset:2px}

/* header in de stijl van het schild */
header.schild{background:var(--navy);color:#fff;position:relative;overflow:hidden;padding:18px 20px 0}
header.schild::before{content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 0 46%,var(--groen) 46% 58%,#fff 58% 61%,var(--blauw) 61% 73%,transparent 73%);
  opacity:.22}
.wrap{max-width:1120px;margin:0 auto}
.kop{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;position:relative;z-index:1}
.kop img{height:150px;width:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.kop h1{font-style:italic;font-weight:800;font-size:clamp(2.2rem,6vw,4rem);margin:0;line-height:.95;
  background:linear-gradient(180deg,#fff 0 55%,var(--zilver) 56% 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.kop .sub{color:var(--zilver);margin:.4em 0 0}
.volgende{border:2px solid var(--zilver);border-radius:10px;padding:10px 16px;min-width:210px;background:rgba(10,22,51,.6)}
.volgende b{display:block;font-family:var(--kop);font-style:italic;font-weight:800;font-size:2.1rem;line-height:1;color:#fff}
.volgende span{color:var(--zilver);font-size:.9rem}
.volgende i{display:block;height:4px;margin:6px 0;border-radius:2px;background:linear-gradient(90deg,var(--groen) 0 48%,#fff 48% 52%,var(--blauw) 52%)}
nav.tabs{display:flex;gap:2px;margin-top:16px;overflow-x:auto;position:relative;z-index:1}
nav.tabs button{background:transparent;border:0;color:var(--zilver);padding:11px 15px;font-family:var(--kop);font-size:1.15rem;font-weight:700;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--bg);color:var(--tekst)}
main{padding:26px 20px 60px}
section[hidden]{display:none}
@media (max-width:760px){.kop{grid-template-columns:auto 1fr}.kop img{height:110px}.volgende{grid-column:1/-1}}

.vlak{background:var(--vlak);border:1px solid var(--lijn);border-radius:10px;padding:18px 20px;margin-bottom:18px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--lijn);vertical-align:middle}
th{font-family:var(--kop);font-size:1.05rem;font-weight:700;color:var(--zacht)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.melding{border-left:5px solid var(--let);background:color-mix(in srgb,var(--let) 12%,var(--vlak));padding:10px 14px;border-radius:4px;margin:10px 0}
.melding.rood{border-color:var(--kaart);background:color-mix(in srgb,var(--kaart) 10%,var(--vlak))}
.melding.groen{border-color:var(--groen);background:color-mix(in srgb,var(--groen) 10%,var(--vlak))}
.melding.blauw{border-color:var(--blauw);background:color-mix(in srgb,var(--blauw) 9%,var(--vlak))}
.knop{background:var(--blauw);color:#fff;border:0;border-radius:6px;padding:9px 16px;cursor:pointer;font-weight:700}
.knop.groen{background:var(--groen)}
.knop.licht{background:transparent;color:var(--tekst);border:1px solid var(--lijn)}
.knop.gevaar{background:var(--kaart)}
.knop:disabled{opacity:.5;cursor:not-allowed}
.rij{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=text],input[type=number],input[type=time],select,textarea{background:var(--vlak);border:1px solid var(--lijn);border-radius:5px;padding:6px 8px}
input[type=number]{width:4.6em}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Consolas,monospace;font-size:.9rem}
.score{width:3.2em!important;text-align:center}
.badge{display:inline-block;font-size:.8rem;padding:1px 8px;border-radius:999px;border:1px solid var(--lijn);margin-left:4px;white-space:nowrap}
.badge.ok{border-color:var(--groen);color:var(--groen)}
.badge.let{border-color:var(--let);color:var(--let)}
.badge.fout{border-color:var(--kaart);color:var(--kaart)}

.rooster td{text-align:center}
.rooster td:first-child,.rooster th:first-child{text-align:left}
.vak{min-width:38px;height:34px;border-radius:17px;border:2px solid var(--lijn);background:transparent;cursor:pointer;font-weight:700;padding:0 8px}
.vak[aria-pressed="true"]{background:var(--groen);border-color:var(--groen);color:#fff}
.vak:disabled{cursor:not-allowed;opacity:.6}
.reeks h3{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-top:0}
.reeks h3 small{font-family:var(--body);font-weight:400;font-size:.9rem;color:var(--zacht)}
.dag{margin-top:14px}
.dag h4{font-size:1.1rem;color:var(--zacht);font-weight:700}
.tijd{font-variant-numeric:tabular-nums;white-space:nowrap}
.rust{color:var(--zacht);font-style:italic}
.pos1 td:first-child{box-shadow:inset 5px 0 0 var(--groen)}
.pos2 td:first-child{box-shadow:inset 5px 0 0 var(--blauw)}
.tl{list-style:none;padding:0;margin:0}
.tl li{display:grid;grid-template-columns:5.5em 1fr;gap:12px;padding:6px 0;border-bottom:1px dashed var(--lijn)}
.tl li b{font-variant-numeric:tabular-nums}
.kal{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kal div{border:1px solid var(--lijn);border-top:4px solid var(--blauw);border-radius:8px;padding:10px 12px;background:var(--vlak)}
.kal div:nth-child(odd){border-top-color:var(--groen)}
.kal div.uit{opacity:.45;text-decoration:line-through}
.kal div.fin{border:2px solid var(--zilver);border-top:6px solid var(--navy-2)}
.kal b{font-family:var(--kop);font-style:italic;font-weight:800;font-size:1.35rem;display:block}
.selectie{columns:2 260px;column-gap:24px}
.selectie label{display:flex;gap:8px;align-items:center;break-inside:avoid;padding:3px 0}
footer{color:var(--zacht);font-size:.85rem;padding:0 20px 30px}
@media (max-width:640px){h2{font-size:1.7rem}.vlak{padding:14px}th,td{padding:6px}}

.balkje{background:var(--navy-2);color:var(--zilver);font-size:.9rem;position:relative;z-index:1}
.balkje .wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:8px 20px}
.balkje select,.balkje button{font-size:.85rem}
.balkje .knop.licht{color:#fff;border-color:rgba(255,255,255,.35)}
.kop2{display:flex;gap:18px;align-items:center;position:relative;z-index:1;padding-bottom:16px}
.kop2 img{height:96px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.kop2 h1{font-style:italic;font-weight:800;font-size:clamp(1.9rem,5vw,3rem);margin:0;color:#fff}
.kop2 p{margin:.2em 0 0;color:var(--zilver)}
.kop2 .wie{margin-left:auto;color:#fff;text-align:right}
.kop2 .wie .knop{background:#fff;color:var(--navy);border:2px solid #fff;font-weight:700;margin-left:8px}
.kop2 .wie .knop:hover{background:var(--groen);border-color:var(--groen);color:#fff}
.kop2 .wie .knop:focus-visible{outline:3px solid var(--groen);outline-offset:2px}
.proto{display:inline-block;background:var(--let);color:#1b1b1b;font-weight:700;font-size:.8rem;border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:middle;font-style:normal;font-family:var(--body)}
.paginatitel{margin-bottom:10px}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 16px;border-bottom:2px solid var(--lijn)}
.subtabs button{background:transparent;border:0;padding:9px 14px;font-family:var(--kop);font-size:1.1rem;font-weight:700;color:var(--zacht);cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px}
.subtabs button[aria-selected="true"]{color:var(--tekst);border-bottom-color:var(--groen)}
.vlak .subtabs{margin-top:-4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.kaart h3{margin-top:0}
.grid .vlak{margin-bottom:0}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.duo2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.veld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-weight:700;border:0;padding:0}
.veld input{font-weight:400}
fieldset.veld legend{margin-bottom:6px}
.check{display:flex;gap:8px;align-items:flex-start;margin:6px 0 14px;max-width:70ch}
.knop.klein{padding:5px 10px;font-size:.85rem}
.link{background:none;border:0;padding:0;color:var(--blauw);text-decoration:underline;cursor:pointer;text-align:left}
.taken{padding-left:18px;margin:0}.taken li{margin:4px 0}
.data{list-style:none;padding:0;margin:0}.data li{display:flex;gap:10px;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--lijn)}
.data em{font-style:normal;font-size:.8rem;color:var(--let)}
.balk{height:8px;background:var(--lijn);border-radius:4px;min-width:90px}.balk i{display:block;height:100%;background:linear-gradient(90deg,var(--groen),var(--blauw));border-radius:4px}
tr.mijn td{background:color-mix(in srgb,var(--groen) 12%,var(--vlak));font-weight:700}
.rood{color:var(--kaart)}.okk{color:var(--groen);font-weight:700}.letop{color:var(--let);font-weight:700}
.mail{border:1px solid var(--lijn);border-radius:8px;padding:10px 14px;margin:8px 0;background:var(--vlak)}
.mail pre{white-space:pre-wrap;font-family:var(--body);margin:10px 0 0}
.demo{padding-left:18px}.demo li{margin:6px 0}
.nr{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--navy-2);color:#fff;font-weight:700;font-size:.85rem}
.aanvraag{border:1px solid var(--lijn);border-left:5px solid var(--blauw);border-radius:6px;padding:10px 14px;margin:8px 0}
h4{font-family:var(--kop);font-size:1.1rem;margin:14px 0 6px}
.ploegkaarten{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.ploegkaart{display:flex;flex-direction:column;gap:4px;border:2px solid var(--lijn);border-radius:10px;padding:12px 14px;font-size:.9rem;color:var(--zacht)}
.ploegkaart b{font-family:var(--kop);font-style:italic;font-weight:800;font-size:1.8rem;color:var(--tekst);line-height:1}
.ploegkaart.aan{border-color:var(--groen);background:color-mix(in srgb,var(--groen) 8%,var(--vlak))}
.ploegkaart .knop{margin-top:6px;align-self:flex-start}
#toast{position:sticky;top:0;z-index:5}
.modaal{position:fixed;inset:0;background:rgba(6,14,34,.55);display:grid;place-items:center;z-index:50;padding:20px}
.modaalvak{background:var(--vlak);color:var(--tekst);border-radius:12px;padding:20px 22px;max-width:460px;width:100%;border-top:6px solid var(--groen);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modaalvak p{margin-top:0}
td.afwijk{font-weight:700;color:var(--blauw)}
@media (max-width:640px){.duo2{grid-template-columns:1fr}.kop2 .wie{margin-left:0;text-align:left;width:100%}.kop2{flex-wrap:wrap}}
</style></head>

/* ============ planning (zelfde logica als de planner) ============ */
function rng(seed){let x=seed||1;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return((x>>>0)%100000)/100000;};}
function verdeelOverDagen(teams,matches,D){
  if(!D)return null;const perTeam=matches.length*2/teams.length;
  for(let extra=0;extra<4;extra++){const cap=Math.ceil(perTeam/D)+extra,dayCap=Math.ceil(matches.length/D)+extra;
    for(let seed=1;seed<40;seed++){const r=rng(seed*7919),order=matches.slice().sort(()=>r()-.5);
      const load={};teams.forEach(t=>load[t]=new Array(D).fill(0));const cnt=new Array(D).fill(0),pairDay={},asg={};let steps=0;
      const bt=k=>{if(++steps>20000)return false;if(k===order.length)return true;const m=order[k],key=[m.a,m.b].sort().join("-");
        const days=[...Array(D).keys()].sort((x,y)=>cnt[x]-cnt[y]||(load[m.a][x]+load[m.b][x])-(load[m.a][y]+load[m.b][y]));
        for(const d of days){if(cnt[d]>=dayCap||load[m.a][d]>=cap||load[m.b][d]>=cap)continue;if(D>1&&pairDay[key]===d)continue;
          cnt[d]++;load[m.a][d]++;load[m.b][d]++;const prev=pairDay[key];pairDay[key]=d;asg[m.id]=d;
          if(bt(k+1))return true;cnt[d]--;load[m.a][d]--;load[m.b][d]--;pairDay[key]=prev;delete asg[m.id];}
        return false;};
      if(bt(0))return{asg,cap};}}
  return null;}
function ordenDag(ms,fields){const rest=ms.slice(),slots=[];let prev=new Set();
  while(rest.length){const used=new Set(),slot=[];
    const sorted=rest.slice().sort((x,y)=>((prev.has(x.a)||prev.has(x.b))?1:0)-((prev.has(y.a)||prev.has(y.b))?1:0));
    for(const m of sorted){if(slot.length>=fields)break;if(used.has(m.a)||used.has(m.b))continue;if((prev.has(m.a)||prev.has(m.b))&&slot.length>0)continue;slot.push(m);used.add(m.a);used.add(m.b);}
    if(!slot.length)slot.push(sorted[0]);slot.forEach(m=>rest.splice(rest.indexOf(m),1));slots.push(slot);prev=new Set(slot.flatMap(m=>[m.a,m.b]));}
  return slots;}
function genereer(u){const teams=teamsIn(u),m=[];
  for(let i=0;i<teams.length;i++)for(let j=i+1;j<teams.length;j++){m.push({id:`${u}:${teams[i]}:${teams[j]}:1`,a:teams[i],b:teams[j],leg:1});m.push({id:`${u}:${teams[i]}:${teams[j]}:2`,a:teams[j],b:teams[i],leg:2});}
  if(teams.length<2){S.schedule[u]=[];return;}
  const v=verdeelOverDagen(teams,m,DAYS.length);if(!v){S.schedule[u]=[];return;}
  S.schedule[u]=m.map(x=>({...x,day:String(v.asg[x.id])}));DAYS.forEach((d,di)=>planDag(u,String(di)));}
/* ---- planning per speeldag: speelduur, velden, tijdvenster, klassementswedstrijden ---- */
function cfg(u,dk){S.daycfg=S.daycfg||{};return Object.assign({start:START,eind:"17:00",dur:FORMAT[u].dur,velden:1,extra:0,rust:RUST,wissel:WISSEL},S.daycfg[dk+"|"+u]||{});}
const rrKlaarNa=(u,dk)=>!(S.schedule[u]||[]).some(m=>!m.extra&&+m.day>+dk);
function planDag(u,dk){const c=cfg(u,dk),slot=2*c.dur+c.rust+c.wissel,alle=S.schedule[u]||[],velden=Math.max(1,c.velden);
  const rest=alle.filter(m=>m.day!==dk),reg=alle.filter(m=>m.day===dk&&!m.extra).map(({extra,slot,time,field,...x})=>x),out=[];
  const put=(x,si,fi)=>out.push({...x,day:dk,slot:si,time:hhmm(toMin(c.start)+si*slot),field:`U${u}-${String.fromCharCode(65+fi)}`});
  const sl=ordenDag(reg,velden);sl.forEach((g,si)=>g.forEach((x,fi)=>put(x,si,fi)));let next=sl.length;
  const paren=Math.floor(teamsIn(u).length/2);
  if(c.extra>0&&paren>0&&rrKlaarNa(u,dk))for(let r=0;r<c.extra;r++){for(let q=0;q<paren;q++){const fi=q%velden;if(q>0&&fi===0)next++;put({id:`${u}:x:${dk}:${r}:${q}`,extra:true,rnd:r+1,pa:2*q,pb:2*q+1,a:null,b:null},next,fi);}next++;}
  S.schedule[u]=rest.concat(out);}
function dagInfo(u,dk){const c=cfg(u,dk),ms=W(u).filter(m=>m.day===dk),slot=2*c.dur+c.rust+c.wissel;
  const eind=toMin(c.start)+(Math.max(-1,...ms.map(m=>m.slot))+1)*slot;
  return{c,reg:ms.filter(m=>!m.extra).length,extra:ms.filter(m=>m.extra).length,eind:hhmm(eind),past:eind<=toMin(c.eind),vrij:Math.max(0,Math.floor((toMin(c.eind)-eind)/slot))};}

const finDur=u=>{const d=finCfg().dur[u];return d?+d:FORMAT[u].dur;};

  return out;}
function finaleRegel(sid,u){const f=finaleSchema()[u];if(!f)return "";const fin=finalisten(u),teg=(fin.teams.length?fin.teams:basisFinalisten(u)).find(x=>x!==sid);

function adminFinalePlanning(){const c=finCfg(),fs=finaleSchema(),cats=CATS.filter(u=>teamsIn(u).length>1);const laatste=cats.length?Object.values(fs).map(x=>x.eindPen).sort().pop():"—";

   </div></div>

   ${cats.map(u=>{const f=fs[u],fin=finalisten(u),t=fin.teams.length?fin.teams:basisFinalisten(u);return `<tr><td><b>U${u}</b></td><td><input type="number" min="5" max="30" data-act="fcfg" data-f="dur" data-u="${u}" value="${finDur(u)}" aria-label="Minuten per helft U${u}"></td><td class="tijd">${f.time}</td><td>${f.field}</td><td>${t.length?t.map(x=>esc(naamS(x))).join(" – "):"nr. 1 – nr. 2 (bekend na speeldag 3)"}</td><td class="tijd">${f.eindPen}</td></tr>`}).join("")}</tbody></table></div>
   <p>Laatste finale klaar om <b>${laatste}</b>; daarna prijsuitreiking.</p>
   <div class="rij"><button class="knop groen" data-act="finOpslaan">Planning bevestigen en scholen verwittigen</button></div></div>`;}
function W(u){const raw=S.schedule[u]||[];if(!raw.some(m=>m.extra))return raw;
  const regs=raw.filter(m=>!m.extra),klaar=regs.every(m=>uitslag(m));const rows=klaar?klassement(u,true).rows:[];
  return raw.map(m=>m.extra?{...m,a:rows[m.pa]?rows[m.pa].id:null,b:rows[m.pb]?rows[m.pb].id:null}:m);}
const tn=(m,k)=>m[k]?naamS(m[k]):`nr. ${(k==="a"?m.pa:m.pb)+1}`;
const xlabel=m=>m.extra?` <span class="badge let">klassementswedstrijd</span>`:"";
const wijzigNotitie=(u,dk)=>{const l=(S.daylog||{})[dk+"|"+u];if(!l)return "";const c=cfg(u,dk);return `<div class="melding blauw">Planning ${dk==="F"?"finale":"speeldag "+(+dk+1)} aangepast op ${esc(new Date(l).toLocaleDateString("nl-BE"))}: start ${c.start}, 2 × ${c.dur}', ${c.velden} veld${c.velden>1?"en":""}${c.extra?`, ${c.extra} ronde${c.extra>1?"s":""} klassementswedstrijden (nr. 1 – nr. 2, nr. 3 – nr. 4)`:""}.</div>`;};
const matchesVan=(sid,dk)=>CATS.flatMap(u=>W(u).filter(m=>m.day===dk&&(m.a===sid||m.b===sid)).map(m=>({...m,u})));
function aanwezigheid(sid){const res={};let joker=null;["0","1","2"].forEach(dk=>{const a=(S.dag[sid+"|"+dk]||{}).aanw;
  if(a==="nee"&&matchesVan(sid,dk).length){if(joker===null){joker=dk;res[dk]="joker";}else res[dk]="forfait";}else res[dk]=a||"";});
  res.F=(S.dag[sid+"|F"]||{}).aanw==="nee"?"forfait":"";return{res,joker};}
const jokerTxt=sid=>{const j=aanwezigheid(sid).joker;return j===null?"beschikbaar":`ingezet op speeldag ${+j+1}`;};
function uitslag(m){if(!m.a||!m.b)return null;const fa=aanwezigheid(m.a).res[m.day]==="forfait",fb=aanwezigheid(m.b).res[m.day]==="forfait";
  if(fa&&fb)return{ga:0,gb:0,dubbel:true};if(fa)return{ga:0,gb:5,afw:true};if(fb)return{ga:5,gb:0,afw:true};
  const r=S.results[m.id];if(!r||r.a===""||r.b===""||r.a==null||r.b==null)return null;return{ga:+r.a,gb:+r.b};}
function klassement(u,reg){const L=reg?(S.schedule[u]||[]).filter(m=>!m.extra):W(u);const T={};teamsIn(u).forEach(t=>T[t]={id:t,g:0,w:0,d:0,v:0,dv:0,dt:0,p:0});let gesp=0;const tot=L.length;
  L.forEach(m=>{const x=uitslag(m);if(!x||!T[m.a]||!T[m.b])return;gesp++;const A=T[m.a],B=T[m.b];A.g++;B.g++;
    if(x.dubbel){A.v++;B.v++;A.dt+=5;B.dt+=5;return;}A.dv+=x.ga;A.dt+=x.gb;B.dv+=x.gb;B.dt+=x.ga;
    if(x.ga>x.gb){A.w++;B.v++;A.p+=3;}else if(x.ga<x.gb){B.w++;A.v++;B.p+=3;}else{A.d++;B.d++;A.p++;B.p++;}});
  const h2h=(a,b)=>{let pa=0,pb=0;L.forEach(m=>{if(!((m.a===a&&m.b===b)||(m.a===b&&m.b===a)))return;const x=uitslag(m);if(!x||x.dubbel)return;const ga=m.a===a?x.ga:x.gb,gb=m.a===a?x.gb:x.ga;if(ga>gb)pa+=3;else if(gb>ga)pb+=3;else{pa++;pb++;}});return pb-pa;};
  return{rows:Object.values(T).sort((a,b)=>b.p-a.p||b.w-a.w||(b.dv-b.dt)-(a.dv-a.dt)||b.dv-a.dv||h2h(a.id,b.id)||naamS(a.id).localeCompare(naamS(b.id))),gesp,tot};}

/* ============ finale: enkel nummers 1 en 2, vrijgeleide voor nummer 3 ============ */
const laatsteSpeeldagVoorbij=()=>{const d=new Date(DAYS[2]);d.setDate(d.getDate()+1);return NOW()>=d;};
const finaleDeadline=()=>{const d=new Date(FINALE);d.setDate(d.getDate()-7);d.setHours(12,0,0,0);return d;};
const finaleDeadlineVoorbij=()=>NOW()>=finaleDeadline();
function basisFinalisten(u){if(!laatsteSpeeldagVoorbij()||teamsIn(u).length<2)return[];return klassement(u).rows.slice(0,2).map(r=>r.id);}
function finaleIngevuld(sid,u){const d=dag(sid,"F"),sel=(S.sel[sid+"|"+u+"|F"]||[]).length>0,lv=!!(d.lv.vn&&d.lv.an);
  const heeftCoach=x=>(d.coaches[x]||[]).some(c=>c.vn&&c.an);
  const zonder=CATS.filter(x=>basisFinalisten(x).includes(sid)&&!heeftCoach(x));
  return sel&&lv&&(heeftCoach(u)||(zonder.length===1&&zonder[0]===u));}
function finalisten(u){const basis=basisFinalisten(u),rows=klassement(u).rows;if(!basis.length)return{teams:[],vrij:[]};
  if(!finaleDeadlineVoorbij())return{teams:basis,vrij:[]};
  const teams=[],vrij=[],reserves=rows.slice(2).map(r=>r.id);
  basis.forEach(id=>{if(finaleIngevuld(id,u))teams.push(id);else if(reserves.length){const r=reserves.shift();vrij.push({uit:id,in:r});teams.push(r);}});
  return{teams,vrij};}
const finalistPloegen=sid=>CATS.filter(u=>school(sid).ploegen.includes(u)&&finalisten(u).teams.includes(sid));
const finaleSelDeadline=(sid,u)=>{const f=finalisten(u);return f.vrij.some(v=>v.in===sid)?selDeadline("F"):finaleDeadline();};
function ploegenOpDag(sid,dk){const s=school(sid);return dk==="F"?finalistPloegen(sid):s.ploegen.filter(u=>W(u).some(m=>m.day===dk&&(m.a===sid||m.b===sid)));}
const zichtbareDagen=sid=>dayKeys().filter(k=>k!=="F"||finalistPloegen(sid).length);
function coachesEffectief(sid,dk){const d=dag(sid,dk),lvOk=!!(d.lv.vn&&d.lv.an),map={},zonder=[];
  ploegenOpDag(sid,dk).forEach(u=>{const c=(d.coaches[u]||[]).filter(x=>x.vn&&x.an);map[u]=c.map(x=>({...x}));if(!c.length)zonder.push(u);});
  let auto=null;if(zonder.length===1&&lvOk){auto=zonder[0];map[auto]=[{vn:d.lv.vn,an:d.lv.an,rol:"verantwoordelijke",auto:true}];}
  return{map,auto,ontbrekend:auto===null?zonder:[],lvOk};}
/* ============ taken per school ============ */
function taken(sid){const s=school(sid),t=[],vd=volgendeDag();
  if(!s.ploegen.length){t.push({urg:true,txt:"Duid de ploegen aan waarmee je deelneemt",tab:"ploegen"});return t;}
  if(!s.ploegenBevestigd&&!ploegenDicht())t.push({urg:true,txt:`Bevestig je ploegen (${s.ploegen.map(u=>"U"+u).join(", ")}) vóór ${fmtK(ploegDeadline())}`,tab:"ploegen"});
  s.ploegen.forEach(u=>{const n=kern(sid,u).length;if(n<FORMAT[u].max&&!kernBevroren())t.push({urg:true,txt:`Kern U${u}: ${n} spelers, minstens ${FORMAT[u].max} aanbevolen`,tab:"kern",u});});
  const vdOk=vd&&(vd!=="F"||finalistPloegen(sid).length);
  if(vdOk&&!selBevroren(vd,sid)){const d=dag(sid,vd);
    if(vd==="F")t.push({urg:true,txt:`Finale: alles invullen vóór ${fmtDT(finaleDeadline())}, anders gaat jullie plaats naar de nummer 3`,tab:"speeldag"});
    if(!d.lv.vn||!d.lv.an)t.push({urg:true,txt:`${dayLabel(vd)}: verantwoordelijke invullen`,tab:"speeldag"});
    ploegenOpDag(sid,vd).forEach(u=>{
      const ce=coachesEffectief(sid,vd);if(ce.ontbrekend.includes(u))t.push({urg:true,txt:ce.ontbrekend.length>1?`${dayLabel(vd)}: coach U${u} invullen (verantwoordelijke kan maar één ploeg overnemen)`:`${dayLabel(vd)}: coach U${u} invullen of eerst de verantwoordelijke`,tab:"speeldag"});
      const sel=S.sel[sid+"|"+u+"|"+vd]||[];if(!sel.length)t.push({urg:true,txt:`${dayLabel(vd)}: selectie U${u} (max. ${FORMAT[u].max})`,tab:"speeldag"});});}
  return t;}

    <li>Spelhervattingen volgens het reglement van de categorie. Scheenbeschermers verplicht.</li>

   <p>Staan ploegen gelijk in punten, dan beslist deze volgorde:</p>
   <ol><li>meeste overwinningen</li><li>beste doelsaldo (gemaakte min tegengekregen doelpunten)</li><li>meeste gemaakte doelpunten</li><li>onderling resultaat tussen de gelijk staande ploegen</li><li>loting door de TVJO</li></ol>
   <h3>Finale – ${esc(fmtD(FINALE))}</h3><ul>

    <li>Selectie, verantwoordelijke en coach moeten ingevuld zijn uiterlijk één week voor de finale (${esc(fmtDT(finaleDeadline()))}).</li>
    <li>Is dat niet gebeurd, dan krijgt de nummer 3 van die reeks een vrijgeleide naar de finale (vallen beide finalisten weg, dan ook de nummer 4). Die ploeg vult in tot ${esc(fmtDT(selDeadline("F")))}.</li>
    <li>Bij gelijkspel in de finale: 5 strafschoppen per ploeg, daarna één tegen één tot er een winnaar is.</li>
    <li>Op de finaledag geldt geen joker: zonder verantwoordelijke gaat de finale verloren met forfait.</li></ul></div>
  <div class="vlak"><h2>Afspraken</h2>
   <h3>Inschrijving en kern</h3><ul>
    <li>Per school per categorie maximaal één ploeg. Ploegen aanduiden tot ${esc(fmtD(ploegDeadline()))}.</li>
    <li>Spelerskern van maximaal ${KERN_MAX} spelers met voornaam, naam en geboortejaar, nodig voor de verzekering.</li>
    <li>De kern wordt bevroren op ${esc(fmtD(freezeDate()))}. Daarna enkel nog aanvullen tot ${KERN_MAX}; een aanvulling is definitief.</li></ul>
   <h3>Per speeldag</h3><ul>
    <li>Selectie voor het wedstrijdblad (max. 8 bij 5v5, 12 bij 8v8), verantwoordelijke en coaches invullen tot maandag 12:00 voor de speeldag. Daarna wordt alles bevroren.</li>
    <li>Elke school heeft een verantwoordelijke, bij voorkeur de leerkracht LO, die zorgt voor orde, netheid en discipline.</li>
    <li>Elke ploeg heeft 1 of 2 coaches: leerkrachten, ouders of familie; het oudercomité kan helpen. Heeft precies één ploeg geen coach, dan wordt de verantwoordelijke automatisch haar coach. Hebben meerdere ploegen geen coach, dan moet de school die aanvullen.</li>
    <li>Joker: één keer zonder verantwoordelijke op een competitiespeeldag zonder gevolgen. Een tweede keer betekent forfait voor alle ploegen van de school die dag. Op de finaledag geldt geen joker.</li>

/* ============ acties ============ */
async function act(el,ev){
  const a=el.dataset.act,sess=S.session;
  switch(a){
  case "logout":S.session=null;ui={tab:"overzicht",view:"login",adminTab:"aanvragen"};break;
  case "naarAanvraag":ui.view="aanvraag";break;case "naarLogin":case "terug":ui.view=S.session?"app":"login";break;
  case "demo":$("lEmail").value=el.dataset.e;$("lPw").value=el.dataset.p;return;
  case "login":{const e=$("lEmail").value.trim().toLowerCase(),p=$("lPw").value;
    if(e===ADMIN.email&&p===ADMIN.pw){S.session={role:"admin"};ui.view="app";break;}
    const s=S.schools.find(x=>x.email.toLowerCase()===e&&x.status==="actief"&&x.pw===p);if(!s){toast("E-mailadres of wachtwoord klopt niet, of de aanvraag is nog niet goedgekeurd.","rood");return;}
    S.session={role:"school",school:s.id};ui.view="app";ui.tab="overzicht";ui.dk=null;break;}
  case "aanvraag":{const naam=$("aNaam").value.trim(),email=$("aEmail").value.trim().toLowerCase(),pl=[...document.querySelectorAll(".aPl:checked")].map(x=>+x.value);
    if(!naam||!email||!/@/.test(email)){toast("Vul minstens de naam van de school en een geldig e-mailadres in.","rood");return;}
    if(S.schools.some(s=>s.email===email)){toast("Er bestaat al een aanvraag of account met dit e-mailadres.","rood");return;}
    let id=naam.toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g,"").slice(0,20)||"school";while(S.schools.some(s=>s.id===id))id+="x";
    const s={id,name:naam,email,pw:"",status:"aanvraag",adres:$("aAdres").value.trim(),contact:{vn:$("aVn").value.trim(),an:$("aAn").value.trim()},ploegen:pl,akkoord:true,aangevraagd:NOW().toLocaleDateString("nl-BE")};
    S.schools.push(s);mail(email,"Je aanvraag voor de Verbroedering Schoolcup is ontvangen",`Beste ${s.contact.vn||"collega"},\n\nWe ontvingen de aanvraag van ${naam}. Na goedkeuring krijg je een mail met je login.\n\nSportieve groeten,\nTVJO Verbroedering Zwijndrecht`);
    mail(ADMIN.email,`Nieuwe aanvraag: ${naam}`,`${naam} vraagt deelname aan voor ${pl.map(u=>"U"+u).join(", ")||"(geen ploegen gekozen)"}.\nContact: ${s.contact.vn} ${s.contact.an}, ${email}`);
    ui.view="login";toast("Aanvraag verstuurd. Bekijk de mailbox (simulatie).");break;}
  case "goed":{const s=school(el.dataset.id);s.status="actief";s.pw=Math.random().toString(36).slice(2,8)+"-"+Math.floor(Math.random()*90+10);
    mail(s.email,"Je account voor de Verbroedering Schoolcup",welkomTekst(s));toast(`${s.name} goedgekeurd; login gemaild.`);break;}
  case "af":{const s=school(el.dataset.id);if(!await bevestig(`Aanvraag van ${s.name} afwijzen?`))return;s.status="afgewezen";mail(s.email,"Je aanvraag voor de Verbroedering Schoolcup",`Beste ${s.contact.vn||"collega"},\n\nWe kunnen jullie aanvraag dit seizoen helaas niet aanvaarden. Neem gerust contact op voor meer uitleg.\n\nTVJO Verbroedering Zwijndrecht`);break;}
  case "schema":if(Object.keys(S.results).length&&!await bevestig("Er zijn al uitslagen. Toch herberekenen?"))return;CATS.forEach(genereer);toast("Speelschema herberekend.");break;
  case "herinner":{let n=0;actief().forEach(s=>{const t=taken(s.id);if(!t.length)return;n++;mail(s.email,"Herinnering Verbroedering Schoolcup",`Beste ${s.contact.vn},\n\nNog te doen voor ${s.name}:\n${t.map(x=>"• "+x.txt).join("\n")}\n\nAanmelden kan via het Schoolcup-portaal.\n\nTVJO Verbroedering Zwijndrecht`);});toast(`${n} herinnering(en) gemaild.`);break;}
  case "finOpslaan":{S.daylog=S.daylog||{};S.daylog["F"]=NOW().toISOString();const fs=finaleSchema();const ontv={};
    CATS.filter(u=>fs[u]).forEach(u=>{const t=finalisten(u).teams.length?finalisten(u).teams:(basisFinalisten(u).length?basisFinalisten(u):teamsIn(u));t.forEach(id=>(ontv[id]=ontv[id]||[]).push(`U${u}: ${fs[u].time} op ${fs[u].field}, 2 × ${finDur(u)}'`));});
    Object.keys(ontv).forEach(id=>{const sc=school(id);mail(sc.email,"Planning finaledag Verbroedering Schoolcup",`Beste ${sc.contact.vn},\n\nDe planning van de finaledag (${fmtD(FINALE)}) is vastgelegd:\n${ontv[id].map(x=>"• "+x).join("\n")}\n\nTVJO Verbroedering Zwijndrecht`);});
    toast(`Finaleplanning bevestigd; ${Object.keys(ontv).length} school/scholen verwittigd.`);break;}
  case "planDag":case "planAlles":{const dk=ui.dk,us=a==="planDag"?[+el.dataset.u]:CATS.filter(u=>teamsIn(u).length>1);
    const metUitslag=us.some(u=>(S.schedule[u]||[]).some(m=>m.day===dk&&S.results[m.id]));
    if(metUitslag&&!await bevestig("Er zijn al uitslagen voor deze speeldag. Uitslagen van klassementswedstrijden kunnen verloren gaan. Toch herberekenen?"))return;
    S.daylog=S.daylog||{};us.forEach(u=>{planDag(u,dk);S.daylog[dk+"|"+u]=NOW().toISOString();});
    const betrokken=[...new Set(us.flatMap(teamsIn))];betrokken.forEach(id=>{const sc=school(id);mail(sc.email,`Planning speeldag ${+dk+1} aangepast`,`Beste ${sc.contact.vn},\n\nDe planning van ${fmtD(DAYS[+dk])} is aangepast voor ${us.filter(u=>sc.ploegen.includes(u)).map(u=>"U"+u+" ("+cfg(u,dk).velden+" velden, 2 × "+cfg(u,dk).dur+"')").join(", ")}. Bekijk de nieuwe uren in het portaal.\n\nTVJO Verbroedering Zwijndrecht`);});
    toast(`Planning herberekend; ${betrokken.length} school/scholen verwittigd.`);break;}
  case "demoAlles":CATS.flatMap(u=>S.schedule[u]||[]).forEach(m=>S.results[m.id]={a:Math.floor(Math.random()*5),b:Math.floor(Math.random()*5)});toast("Alle uitslagen ingevuld (demo).");break;
  case "demoUitslag":(CATS.flatMap(u=>W(u).filter(m=>m.day===ui.dk))).forEach(m=>S.results[m.id]={a:Math.floor(Math.random()*5),b:Math.floor(Math.random()*5)});break;
  case "tab":ui.tab=el.dataset.k;if(el.dataset.u)ui.u=+el.dataset.u;break;
  case "atab":ui.adminTab=el.dataset.k;break;
  case "ploeg":if(el.type==="checkbox")return planChange(el);ui.u=+el.dataset.k;break;
  case "dag":ui.dk=el.dataset.k;break;
  case "pdel":if(kernBevroren())return;S.players=S.players.filter(p=>p.id!==el.dataset.id);break;
  case "padd":{const vn=$("pVn").value.trim(),an=$("pAn").value.trim(),gj=parseInt($("pGj").value,10),lj=+$("pLj").value,u=ui.u,sid=sess.school;
    if(!vn||!an||!gj){toast("Vul voornaam, naam en geboortejaar in.","rood");return;}
    const r=speelrecht(gj,u);if(!r.ok){toast(`Geboren in ${gj}: mag niet in U${u} spelen (${r.txt}).`,"rood");return;}
    if(kern(sid,u).length>=KERN_MAX){toast("Kern volzet.","rood");return;}
    if(kernBevroren()&&!await bevestig(`${vn} ${an} definitief toevoegen aan U${u}? Dit kan nadien niet meer gewijzigd worden.`))return;
    S.players.push({id:uid(),school:sid,vn,an,gj,lj,team:u,aanv:kernBevroren()?NOW().toLocaleDateString("nl-BE"):""});break;}
  case "ploegzet":{if(ploegenDicht())return;const s=school(sess.school),u=+el.dataset.u;
    if(s.ploegen.includes(u)){if(kern(s.id,u).length&&!await bevestig(`U${u} uitschrijven? De ${kern(s.id,u).length} spelers in deze kern worden verwijderd.`))return;
      s.ploegen=s.ploegen.filter(x=>x!==u);S.players=S.players.filter(p=>!(p.school===s.id&&p.team===u));}
    else{s.ploegen.push(u);s.ploegen.sort((a,b)=>a-b);}
    s.ploegenBevestigd=false;genereer(u);break;}
  case "ploegbev":{const s=school(sess.school);s.ploegenBevestigd=true;mail(s.email,"Bevestiging ploegen Verbroedering Schoolcup",`Beste ${s.contact.vn},\n\n${s.name} neemt deel met: ${s.ploegen.map(u=>"U"+u).join(", ")}.\nVul nu per ploeg de spelerskern in vóór ${fmtD(freezeDate())}.\n\nTVJO Verbroedering Zwijndrecht`);toast("Ploegen bevestigd; bevestiging gemaild.");break;}
  case "pw":{const p=$("nPw").value;if(p.length<8){toast("Kies minstens 8 tekens.","rood");return;}school(sess.school).pw=p;toast("Wachtwoord gewijzigd.");break;}
  default:return;}
  save();render();}
function planChange(el){const s=school(S.session.school),u=+el.value;if(el.checked){if(!s.ploegen.includes(u))s.ploegen.push(u);s.ploegen.sort();}else s.ploegen=s.ploegen.filter(x=>x!==u);save();render();}
function change(el){const a=el.dataset.act;if(!a)return;const sess=S.session;
  switch(a){
  case "lv":{if(selBevroren(ui.dk,sess.school))return;const d=dag(sess.school,ui.dk);d.lv[el.dataset.f]=el.type==="checkbox"?el.checked:el.value.trim();save();render();return;}
  case "coach":{if(selBevroren(ui.dk,sess.school))return;const d=dag(sess.school,ui.dk),c=d.coaches[el.dataset.u];c[+el.dataset.i][el.dataset.f]=el.value.trim();save();render();return;}
  case "sel":{const key=el.dataset.key,[ksid,u,dk]=key.split("|");if(selBevroren(dk,ksid)){render();return;}const arr=S.sel[key]=S.sel[key]||[];
    if(el.checked){if(arr.length<FORMAT[u].max)arr.push(el.dataset.id);}else S.sel[key]=arr.filter(x=>x!==el.dataset.id);break;}
  case "prof":school(sess.school).contact[el.dataset.f]=el.value.trim();save();return;
  case "ploeg":return planChange(el);
  case "aanw":dag(el.dataset.id,ui.dk).aanw=el.value;break;
  case "fcfg":{S.finCfg=S.finCfg||{dur:{}};S.finCfg.dur=S.finCfg.dur||{};const f=el.dataset.f;
    if(f==="dur")S.finCfg.dur[el.dataset.u]=Math.max(5,parseInt(el.value,10)||5);else S.finCfg[f]=f==="start"?el.value:Math.max(0,parseInt(el.value,10)||0);
    save();render();return;}
  case "cfg":{S.daycfg=S.daycfg||{};const k=ui.dk+"|"+el.dataset.u,c=S.daycfg[k]=S.daycfg[k]||{};const f=el.dataset.f;c[f]=(f==="start"||f==="eind")?el.value:Math.max(f==="dur"?5:0,parseInt(el.value,10)||0);save();return;}
  case "res":{const r=S.results[el.dataset.id]=S.results[el.dataset.id]||{};r[el.dataset.s]=el.value===""?"":Math.max(0,parseInt(el.value,10)||0);save();return;}
  default:return;}
  save();render();}

/* ============ start ============ */
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;if(b.tagName==="INPUT"||b.tagName==="SELECT")return;act(b,e);});
document.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.act)change(e.target);});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="lPw"||e.target.id==="lEmail"))act({dataset:{act:"login"}});});
$("mailknop").addEventListener("click",()=>{ui.view="mail";render();});
$("modelknop").addEventListener("click",()=>{ui.view="model";render();});
$("regknop").addEventListener("click",()=>{if(S.session){ui.view="app";if(S.session.role==="admin")ui.adminTab="reglement";else ui.tab="reglement";}else ui.view="reg";render();});
$("tijd").addEventListener("change",e=>{S.now=e.target.value||null;save();render();});
$("reset").addEventListener("click",async()=>{if(!await bevestig("Demo terugzetten naar de fictieve startdata?"))return;seed();ui={tab:"overzicht",view:"login",adminTab:"aanvragen"};save();render();});
try{const j=localStorage.getItem(LS);if(j)S=JSON.parse(j);}catch(e){}
if(!S||S.v!==1)seed();
if(S.session)ui.view="app";
$("tijd").value=S.now||"";
render();
})();

</script></body></html>
